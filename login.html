<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
        }
        .auth-card {
            padding: 30px;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .auth-toggle a {
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }
        .auth-toggle a:hover {
            text-decoration: underline;
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
        }
        .error-message {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
            background: #fce4e4;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid var(--danger-color);
        }
    </style>
</head>
<body>
    <div class="container auth-container">
        <header>
            <h1><i class="fas fa-wallet"></i> Expense Tracker</h1>
        </header>
        
        <!-- Login Form -->
        <div class="card auth-card" id="login-section">
            <h3 style="text-align: center; border: none; font-size: 1.5rem; margin-bottom: 20px;">Welcome Back</h3>
            <div id="login-error" class="error-message"></div>
            <form id="login-form">
                <div class="form-control">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-control">
                    <label for="login-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="login-password" required placeholder="Enter your password">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('login-password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Login</button>
            </form>
            <p class="auth-toggle">Don't have an account? <a onclick="showSignUp()">Sign Up</a></p>
        </div>

        <!-- Sign Up Form -->
        <div class="card auth-card" id="signup-section" style="display: none;">
            <h3 style="text-align: center; border: none; font-size: 1.5rem; margin-bottom: 20px;">Create Account</h3>
            <div id="signup-error" class="error-message"></div>
            <form id="signup-form">
                <div class="form-control">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" required placeholder="Enter your name">
                </div>
                <div class="form-control">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-control">
                    <label for="signup-password">Password</label>
                    <div class="password-container">
                        <input type="password" id="signup-password" required placeholder="Create a password (min 6 chars)">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword('signup-password', this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 20px;">Sign Up</button>
            </form>
            <p class="auth-toggle">Already have an account? <a onclick="showLogin()">Login</a></p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
